name: hourly-bot
on:
  schedule: [{cron: "7 * * * *"}]
  workflow_dispatch:
concurrency: {group: indila-bot, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python bot/main.py
        env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"}
      - name: Commit changes
        run: |
          git config user.name "indila-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "bot: update content" && git push)
